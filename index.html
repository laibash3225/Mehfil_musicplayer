<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mehfil — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

  <!-- LEFT: DECK -->
  <div class="deck">
    <div class="brand"><b>Mehfil</b> — a small record player</div>

    <div class="disc-wrap">
      <div class="disc" id="disc">
        <img id="discCover" src="https://picsum.photos/seed/midnight-drive/300/300" alt="">
      </div>
      <div class="tonearm" id="tonearm">
        <svg viewBox="0 0 70 70" fill="none">
          <circle cx="58" cy="10" r="7" fill="#2a241d" stroke="#e8a33d" stroke-width="1.5"/>
          <line x1="58" y1="16" x2="14" y2="58" stroke="#8a6a34" stroke-width="3" stroke-linecap="round"/>
          <circle cx="14" cy="58" r="3" fill="#e8a33d"/>
        </svg>
      </div>
    </div>

    <div class="track-meta">
      <div class="track-title" id="nowTitle">Nothing spinning</div>
      <div class="track-artist" id="nowArtist">Pick a track from the playlist →</div>
    </div>

    <div class="seek">
      <span id="curTime">0:00</span>
      <input type="range" id="seekBar" min="0" max="100" value="0" />
      <span id="durTime">0:00</span>
    </div>

    <div class="transport">
      <button id="prevBtn" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="playBtn" class="btn-play" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-3.5 6L4 6v12z"/></svg>
      </button>
    </div>

    <div class="vol">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
      <input type="range" id="volBar" min="0" max="1" step="0.01" value="0.8" />
    </div>
  </div>

  <!-- RIGHT: LIBRARY -->
  <div class="library">
    <div class="lib-head">
      <h1>Playlist</h1>
      <div class="controls-row">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search title, artist, album…" />
        </div>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <ul class="track-list" id="trackList"></ul>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
